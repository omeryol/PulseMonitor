# Sürüm yayını: "v0.7.1" gibi bir etiket gönderilince Windows'ta derler, kurulum dosyasını ve taşınabilir zip'i
# GitHub Releases'a ekler. Elle çalıştırılınca (Actions → Release → Run workflow) yalnızca dosyaları üretir.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Tam commit kimliği, değişken sürüm etiketinin sonradan farklı bir koda işaret etmesini önler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.0.0
        with:
          dotnet-version: '10.0.403'

      - name: Tracked files guard
        shell: powershell
        run: .\tools\check_tracked.ps1

      - name: Unit tests
        run: dotnet test tests/PulseMonitor.Tests --nologo -v q
      - name: Windows feature tests
        run: dotnet test tests/PulseMonitor.WindowsTests --nologo -v q

      - name: Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Release notes present
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # The app's update window shows these notes (release-notes/v<version>.md, sections <!-- lang:xx -->).
          if (-not (Test-Path 'release-notes/${{ github.ref_name }}.md')) { Write-Error 'release-notes/${{ github.ref_name }}.md is missing'; exit 1 }

      - name: Build installer and portable zip
        shell: pwsh
        run: |
          $version = ''
          if ('${{ github.ref_type }}' -eq 'tag') { $version = '${{ github.ref_name }}'.TrimStart('v') }
          powershell -ExecutionPolicy Bypass -File tools/build_release.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PulseMonitor
          path: |
            artifacts/PulseMonitor-Setup-*.exe
            artifacts/PulseMonitor-*-portable.zip

      - name: Release title
        id: relname
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Ad, release-notes/<etiket>.md başındaki "<!-- name: Ad -->" satırından gelir: "Lodos 0.15.1"; yoksa yalnızca etiket.
          $title = '${{ github.ref_name }}'
          $notes = Get-Content 'release-notes/${{ github.ref_name }}.md' -Raw -Encoding UTF8
          if ($notes -match '(?m)^<!--\s*name:\s*(.+?)\s*-->') { $title = "$($Matches[1]) $($title.TrimStart('v'))" }
          "title=$title" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (üçüncü taraf: commit ile sabitlendi)
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/PulseMonitor-Setup-*.exe
            artifacts/PulseMonitor-*-portable.zip
          name: ${{ steps.relname.outputs.title }}
          body_path: release-notes/${{ github.ref_name }}.md
